<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff1df"><title>Pip's Playbook</title><meta name="description" content="Gentle pixel-art thinking games for little explorers"><style>
:root{--cream:#fff6e7;--paper:#fffaf1;--rose:#e77d9c;--burg:#793448;--green:#71934e;--mint:#b6dfb4;--gold:#efc16b;--shadow:#b88b70;--ink:#633b45}*{box-sizing:border-box}body{margin:0;background:#f1dcc4;color:var(--ink);font-family:ui-rounded,'Trebuchet MS',Verdana,sans-serif;min-height:100dvh}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #3f8bc9;outline-offset:3px}#app{min-height:100dvh;display:flex;justify-content:center;align-items:stretch;background:radial-gradient(circle at 15% 10%,#ffe9c8,transparent 40%),linear-gradient(145deg,#e0edc9,#f8dbd2)}.shell{width:min(100%,1080px);min-height:100dvh;position:relative;padding:clamp(12px,3vw,26px);display:flex;flex-direction:column;gap:14px}.pixel{border:4px solid var(--burg);box-shadow:5px 5px 0 #ac7380;border-radius:12px;background:var(--paper)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 15px;background:#fff8e9}.brand{font-weight:1000;font-size:clamp(19px,3.5vw,30px);letter-spacing:.2px;color:var(--burg);text-shadow:1px 2px #f2c6c6}.tag{font-size:12px;font-weight:800;color:#9a6670}.nav-actions{display:flex;gap:9px}.iconbtn,.btn{border:3px solid var(--burg);box-shadow:3px 3px 0 #b17b7a;border-radius:10px;background:#b5dca9;color:#59313a;font-weight:900;padding:11px 16px;min-height:52px}.iconbtn{min-width:52px;font-size:21px;padding:7px}.btn:active,.iconbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #b17b7a}.btn.yellow{background:#f5d279}.btn.pink{background:#f3b6c8}.btn.cream{background:#fff9e8}.btn:disabled{opacity:.55;cursor:default}.main{flex:1;display:flex;flex-direction:column;gap:16px}.hero{display:flex;align-items:center;gap:20px;padding:16px 22px;min-height:145px;background:linear-gradient(120deg,#fff8eb,#e7f2d6)}.pip{width:110px;height:110px;object-fit:cover;border-radius:16px;image-rendering:pixelated;mix-blend-mode:multiply;flex-shrink:0}.hero h1,.screen-title{margin:0;color:var(--burg);font-weight:1000;font-size:clamp(22px,4vw,35px)}.hero p{margin:7px 0 0;font-size:clamp(14px,2.4vw,18px);line-height:1.4}.game-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;flex:1}.gamecard{background:#fff9ec;border:4px solid var(--burg);box-shadow:5px 5px 0 #b37f7d;border-radius:13px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:148px;color:var(--burg)}.gamecard:nth-child(1){background:#e4effc}.gamecard:nth-child(2){background:#fff0ba}.gamecard:nth-child(3){background:#e9e0fa}.gamecard:nth-child(4){background:#ffe2e8}.gamecard .art{font-size:clamp(42px,7vw,74px);filter:drop-shadow(3px 4px #b8a4a3)}.gamecard strong{font-weight:1000;font-size:clamp(17px,2.4vw,25px);text-align:center}.gamecard small{font-weight:700;text-align:center}.bottom{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.center{text-align:center}.panel{padding:18px;flex:1;display:flex;flex-direction:column;gap:13px}.subtitle{font-size:15px;font-weight:800;color:#8a6570}.profile-grid,.collection-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px}.profile{padding:15px;min-height:150px;font-size:47px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px}.profile span{font-size:17px;font-weight:900}.playbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}.progress{background:#ead5b7;border:3px solid #aa8273;height:20px;border-radius:10px;overflow:hidden;min-width:130px;flex:1;max-width:280px}.progress>div{height:100%;background:#8eba7a;transition:width .3s}.playfield{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:300px;border:3px dashed #d9b6a1;border-radius:15px;background:linear-gradient(#fdf8e7d9,#f7edddcf),repeating-linear-gradient(90deg,#d5eac1 0 25px,#e4efcc 25px 50px);padding:18px}.memory-grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,115px));gap:12px;width:100%;justify-content:center}.memory-card{width:100%;aspect-ratio:1;min-height:55px;max-height:115px;border:4px solid var(--burg);border-radius:12px;background:#f8d78c;color:#7d4058;font-size:clamp(29px,6vw,57px);box-shadow:3px 4px #c49381;display:grid;place-items:center;transition:background .15s}.memory-card.open{background:#fff9f1}.memory-card.matched{background:#d3edc7;border-color:#648d57}.pattern-line{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}.tile{width:clamp(49px,10vw,92px);height:clamp(58px,11vw,100px);background:#fffaf1;border:3px solid #a76b72;border-radius:12px;display:grid;place-items:center;font-size:clamp(30px,6vw,56px);font-weight:1000}.tile.blank{border-style:dashed;color:#b78389;background:#fff2e2}.choices{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}.choice{font-size:45px;min-width:90px;min-height:90px}.mascot-line{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:900;text-align:center}.mascot-line .pip{width:70px;height:70px}.feedback{font-size:18px;font-weight:900;color:#6b8647;min-height:24px;text-align:center}.reward{font-size:clamp(55px,12vw,110px);text-align:center;animation:pop .5s}.collection-grid .pixel{padding:15px;text-align:center;font-size:47px;min-height:100px}.collection-grid small{display:block;font-size:12px;font-weight:800}.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.stat{padding:15px;background:#f7eacb;border-radius:11px;border:2px solid #c19a7d}.stat b{font-size:30px;color:var(--burg);display:block}.footer-note{font-size:12px;color:#8f6b72;text-align:center}.modalshade{position:fixed;inset:0;background:#321d2a8c;display:grid;place-items:center;padding:20px;z-index:10}.dialog{max-width:420px;width:100%;padding:25px;text-align:center}.dialog h2{color:var(--burg)}.dialog .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.dialog input{width:100%;padding:14px;border:3px solid var(--burg);border-radius:10px;font-size:20px;margin:10px 0} @keyframes pop{50%{transform:scale(1.13)}}@media(orientation:landscape) and (max-height:620px){.shell{padding:8px 18px;gap:8px}.top{padding:5px 12px}.hero{min-height:80px;padding:7px 15px}.hero .pip{height:75px;width:75px}.game-grid{grid-template-columns:repeat(4,1fr)}.gamecard{min-height:130px}.gamecard .art{font-size:43px}.playfield{min-height:190px;padding:9px}.memory-card{max-height:70px}.memory-grid{grid-template-columns:repeat(var(--cols),minmax(0,77px));gap:6px}.panel{padding:10px;gap:7px}.tile{height:65px;width:65px}.choice{min-width:70px;min-height:65px;font-size:35px}.mascot-line .pip{height:50px;width:50px}}@media(max-width:410px){.shell{padding:9px;gap:9px}.gamecard{min-height:133px;padding:9px}.gamecard strong{font-size:17px}.hero{padding:10px}.hero .pip{width:85px;height:85px}.memory-grid{gap:6px}.memory-card{border-width:3px}.tile{width:49px;height:58px}.choice{min-width:70px;min-height:72px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><script>
const app=document.getElementById('app'),mascot='assets/pip.png';const key='pips-playbook-v1';const initial={profiles:[{id:'p1',name:'Explorer',avatar:'🐸',levels:{memory:1,pattern:1},streak:{memory:0,pattern:0},rounds:{memory:0,pattern:0},stickers:[]}],current:'p1',sound:true};let data;try{data=JSON.parse(localStorage.getItem(key))||initial}catch(e){data=initial}let screen='profiles',game='',round=null,flipped=[],busy=false,feedback='',modal=null;function save(){localStorage.setItem(key,JSON.stringify(data))}function profile(){return data.profiles.find(p=>p.id===data.current)||data.profiles[0]}function speak(s){if(!data.sound||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.rate=.86;u.pitch=1.15;speechSynthesis.speak(u)}function icon(t,fn){return `<button class="iconbtn" aria-label="${t}" onclick="${fn}">${t}</button>`}function header(back=true){return `<header class="top pixel"><div class="brand">🌸 Pip's Playbook</div><div class="nav-actions">${back?icon('⌂','goHome()'):''}${icon(data.sound?'🔊':'🔇','toggleSound()')}</div></header>`}function pip(){return `<img class="pip" src="${mascot}" alt="Pip the pink axolotl">`}function goHome(){if(screen==='memory'||screen==='pattern'){modal='leave';render();return}screen='library';round=null;render()}function toggleSound(){data.sound=!data.sound;save();render()}function chooseProfile(id){data.current=id;save();screen='library';render();speak('Hello little explorer! Choose a game to play!')}function makeProfile(){modal='newprofile';render()}function addProfile(){let n=document.getElementById('profile-name')?.value.trim().slice(0,18);if(!n)return;let id='p'+Date.now();data.profiles.push({id,name:n,avatar:['🐸','🐰','🐻','🦊'][data.profiles.length%4],levels:{memory:1,pattern:1},streak:{memory:0,pattern:0},rounds:{memory:0,pattern:0},stickers:[]});data.current=id;save();modal=null;screen='library';render()}function start(g){game=g;screen=g;feedback='';newRound();speak(g==='memory'?"Let's find two pictures that match!":"Look carefully! What comes next?")}function newRound(){flipped=[];busy=false;feedback='';let p=profile(),lvl=p.levels[game]||1;if(game==='memory'){let pairs=Math.min(6,lvl+1),pool=['🐱','🐰','🐻','🦊','🐼','🐸','🐶','🦋'];let faces=pool.slice(0,pairs).flatMap(x=>[x,x]);for(let i=faces.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[faces[i],faces[j]]=[faces[j],faces[i]]}round={faces,open:[],matched:[],turns:0,errors:0,hints:0,pairs};}else{let types=[['🍎','🍐'],['🌼','🍄'],['⭐','🌙'],['🐟','🐚']];let symbols=types[Math.floor(Math.random()*types.length)];let mode=lvl<3?'AB':lvl<5?'AAB':'ABC';if(mode==='ABC')symbols=[...symbols,'🌳'];let base=mode==='AB'?[0,1]:mode==='AAB'?[0,0,1]:[0,1,2];let indexes=Array.from({length:lvl<3?5:6},(_,i)=>base[i%base.length]);let answer=symbols[indexes[indexes.length-1]];let choices=[...symbols];if(choices.length<3)choices.push('🍓');choices.sort(()=>Math.random()-.5);round={symbols,indexes,answer,choices,attempts:0,hints:0,mode};}render()}
function flip(i){if(busy||round.matched.includes(i)||round.open.includes(i)||round.open.length===2)return;round.open.push(i);render();if(round.open.length===2){round.turns++;busy=true;let [a,b]=round.open;if(round.faces[a]===round.faces[b]){setTimeout(()=>{round.matched.push(a,b);round.open=[];busy=false;feedback='Lovely match!';if(round.matched.length===round.faces.length){complete(round.errors<=round.pairs&&round.hints===0)}else render()},580)}else{round.errors++;feedback='Have another look!';setTimeout(()=>{round.open=[];busy=false;render()},1050)}}}function choosePattern(x){if(busy)return;round.attempts++;if(x===round.answer){feedback='You found the pattern!';busy=true;render();setTimeout(()=>complete(round.attempts===1&&round.hints===0),800)}else{feedback='Good try! Look at the repeating pictures.';render();speak('Let us have another look.')}}function hint(){if(!round)return;round.hints++;if(game==='memory'){let i=round.faces.findIndex((x,i)=>!round.matched.includes(i)&&!round.open.includes(i));if(i>=0){round.open.push(i);render();setTimeout(()=>{round.open=round.open.filter(n=>n!==i);render()},1150)}}else{feedback='Look for the same repeating group. '+(round.mode==='AAB'?'Two of one, then one of another.':'What starts the pattern again?');render();speak(feedback)}}function complete(mastered){let p=profile();p.rounds[game]++;p.streak[game]=mastered?p.streak[game]+1:0;if(p.streak[game]>=3){p.levels[game]=Math.min(5,p.levels[game]+1);p.streak[game]=0}let token=game==='memory'?'🌷':'🍓';if(p.rounds[game]%2===0&&!p.stickers.includes(token))p.stickers.push(token);save();screen='win';render();speak('Wonderful! You did it!')}function parent(){modal='parent';render()}function showParents(){modal=null;screen='parent';render()}function closeModal(){modal=null;render()}function openGame(g){if(g==='shape'||g==='art'){modal=g;render();return}start(g)}function render(){let p=profile(),body='';if(screen==='profiles'){body=`${header(false)}<main class="main panel pixel"><h1 class="screen-title center">Who's playing today?</h1><div class="mascot-line">${pip()}<span>Tap your little friend!</span></div><div class="profile-grid">${data.profiles.map(q=>`<button class="profile pixel" onclick="chooseProfile('${q.id}')">${q.avatar}<span>${escapeHtml(q.name)}</span></button>`).join('')}<button class="profile pixel" onclick="makeProfile()">➕<span>Add child</span></button></div><div class="bottom"><button class="btn cream" onclick="parent()">🔒 Parent area</button></div></main>`}else if(screen==='library'){body=`${header(false)}<main class="main"><section class="hero pixel">${pip()}<div><h1>Hi, ${escapeHtml(p.name)}!</h1><p>What shall we play today? 🌟</p></div></section><section class="game-grid"><button class="gamecard" onclick="openGame('memory')"><span class="art">🃏</span><strong>Memory Garden</strong><small>Remember & match</small></button><button class="gamecard" onclick="openGame('pattern')"><span class="art">🍎</span><strong>Pattern Parade</strong><small>Find the next picture</small></button><button class="gamecard" onclick="openGame('shape')"><span class="art">🧩</span><strong>Shape Workshop</strong><small>Coming next</small></button><button class="gamecard" onclick="openGame('art')"><span class="art">🎨</span><strong>Imagination Studio</strong><small>Coming next</small></button></section><div class="bottom"><button class="btn yellow" onclick="screen='collection';render()">📖 My Collection</button><button class="btn cream" onclick="screen='profiles';render()">🔁 Switch Player</button><button class="btn cream" onclick="parent()">🔒 Parents</button></div></main>`}else if(screen==='memory'){body=`${header()}<main class="main panel pixel"><div class="playbar"><h1 class="screen-title">🃏 Memory Garden</h1><span class="subtitle">Challenge ${p.levels.memory} · ${round.matched.length/2}/${round.pairs} pairs</span></div><div class="progress"><div style="width:${100*round.matched.length/round.faces.length}%"></div></div><div class="playfield"><div class="memory-grid" style="--cols:${round.pairs<=2?2:round.pairs<=3?3:4}">${round.faces.map((f,i)=>`<button class="memory-card ${round.open.includes(i)?'open':''} ${round.matched.includes(i)?'matched':''}" aria-label="Card ${i+1}" onclick="flip(${i})">${round.open.includes(i)||round.matched.includes(i)?f:'✿'}</button>`).join('')}</div><div class="feedback">${feedback||'Find the matching pictures!'}</div></div><div class="bottom"><button class="btn yellow" onclick="hint()">💡 Hint</button><button class="btn cream" onclick="speak('Tap two cards to find matching pictures.')">🔊 Listen</button></div></main>`}else if(screen==='pattern'){body=`${header()}<main class="main panel pixel"><div class="playbar"><h1 class="screen-title">🍎 Pattern Parade</h1><span class="subtitle">Challenge ${p.levels.pattern} · ${round.mode}</span></div><div class="playfield"><div class="mascot-line">${pip()}<span>What comes next?</span></div><div class="pattern-line">${round.indexes.map((idx,i)=>`<div class="tile ${i===round.indexes.length-1?'blank':''}">${i===round.indexes.length-1?'?':round.symbols[idx]}</div>`).join('')}</div><div class="choices">${round.choices.map(s=>`<button class="btn choice cream" aria-label="Choose ${s}" onclick="choosePattern('${s}')">${s}</button>`).join('')}</div><div class="feedback">${feedback}</div></div><div class="bottom"><button class="btn yellow" onclick="hint()">💡 Hint</button><button class="btn cream" onclick="speak('Look at the pictures. What comes next?')">🔊 Listen</button></div></main>`}else if(screen==='win'){body=`${header()}<main class="main panel pixel center" style="justify-content:center;align-items:center"><div class="reward">🌟</div><h1 class="screen-title">Wonderful, ${escapeHtml(p.name)}!</h1><div class="mascot-line">${pip()}<span>You did it!</span></div><p>You practised ${game==='memory'?'remembering pictures':'finding patterns'}.</p><div class="bottom"><button class="btn yellow" onclick="screen='${game}';newRound()">▶ Play Again</button><button class="btn cream" onclick="goHome()">⌂ Games</button></div></main>`}else if(screen==='collection'){let stamps=p.stickers;body=`${header()}<main class="main panel pixel"><h1 class="screen-title">📖 My Collection</h1><p>Every little discovery is special!</p><div class="collection-grid">${['🌷','🍓','🧩','🎨','🐚','⭐'].map(s=>`<div class="pixel">${stamps.includes(s)?s:'❔'}<small>${stamps.includes(s)?'Collected':'Keep exploring'}</small></div>`).join('')}</div><div class="mascot-line">${pip()}<span>Keep playing and collecting!</span></div><div class="bottom"><button class="btn" onclick="goHome()">⌂ Back to Games</button></div></main>`}else if(screen==='parent'){body=`${header()}<main class="main panel pixel"><h1 class="screen-title">🔒 Parent Dashboard</h1><p class="subtitle">Prototype activity summary for ${escapeHtml(p.name)}. Game results are not cognitive diagnoses.</p><div class="settings"><div class="stat"><b>${p.rounds.memory}</b>Memory rounds</div><div class="stat"><b>${p.rounds.pattern}</b>Pattern rounds</div><div class="stat"><b>${p.levels.memory}</b>Memory tier</div><div class="stat"><b>${p.levels.pattern}</b>Pattern tier</div></div><h2>Prototype settings</h2><p>Progress is saved locally in this browser. No account, advertising or remote child data collection is used in this version.</p><div class="bottom"><button class="btn" onclick="screen='profiles';render()">👪 Profiles</button><button class="btn cream" onclick="goHome()">⌂ Games</button></div></main>`}app.innerHTML=`<div class="shell">${body}<div class="footer-note">Pip's Playbook · Gentle learning through play · Prototype v0.1</div></div>${modalHtml()}`}
function modalHtml(){if(!modal)return '';let title='',body='',actions='';if(modal==='leave'){title='Leave this round?';body='Your completed rounds are saved. This unfinished round will restart.';actions=`<button class="btn cream" onclick="closeModal()">Keep Playing</button><button class="btn pink" onclick="modal=null;screen='library';round=null;render()">Leave</button>`}else if(modal==='newprofile'){title='Add a little explorer';body=`<input id="profile-name" maxlength="18" placeholder="Nickname" aria-label="Child nickname">`;actions=`<button class="btn cream" onclick="closeModal()">Cancel</button><button class="btn" onclick="addProfile()">Create</button>`}else if(modal==='parent'){title='Parent Area';body='For this prototype, the dashboard is a demonstration only. A verified parental gate will be required before release.';actions=`<button class="btn cream" onclick="closeModal()">Cancel</button><button class="btn" onclick="showParents()">Continue</button>`}else{title=modal==='shape'?'Shape Workshop':'Imagination Studio';body='This game is planned for the next prototype. Memory Garden and Pattern Parade are ready to play now!';actions=`<button class="btn" onclick="closeModal()">Okay!</button>`}return `<div class="modalshade"><div class="dialog pixel" role="dialog" aria-modal="true"><h2>${title}</h2><p>${body}</p><div class="actions">${actions}</div></div></div>`}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}render();
</script><style>.active-mini-game .top{justify-content:flex-start}.active-mini-game .top .nav-actions{order:0}.active-mini-game .top .brand{order:1;margin-left:auto;font-size:clamp(16px,2.5vw,25px)}.active-mini-game .iconbtn{min-width:48px;min-height:48px;padding:5px;font-size:20px}.active-mini-game .playfield{flex:0 1 auto;min-height:0}.active-mini-game .panel{overflow:visible}.active-mini-game .memory-card{max-height:100px}.pip-tip{display:flex;align-items:center;justify-content:center;gap:12px;width:min(100%,430px);margin:0 auto}.pip-tip .pip{width:66px;height:66px;flex:0 0 66px}.pip-bubble{position:relative;background:#fffaf2;border:3px solid #793448;border-radius:14px;padding:12px 15px;color:#793448;font-size:clamp(14px,2.6vw,18px);font-weight:900;line-height:1.25;box-shadow:3px 3px #dfb5a4}.pip-bubble:before{content:'';position:absolute;left:-11px;top:18px;width:15px;height:15px;background:#fffaf2;border-left:3px solid #793448;border-bottom:3px solid #793448;transform:rotate(45deg)}.hero .pip-bubble{flex:1;max-width:620px}.hero .pip-bubble h1{font-size:clamp(21px,3vw,32px)}.hero .pip-bubble p{margin-top:5px}.memory-card.matched,.tile.correct-answer{position:relative}.memory-card.matched:after,.tile.correct-answer:after{content:'✓';position:absolute;top:-11px;right:-9px;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:3px solid #fffdf1;background:#589c5c;color:white;font-size:22px;font-weight:1000;box-shadow:2px 2px #68835a;pointer-events:none;animation:pop .2s ease-out}.wonderful-stage{min-height:240px!important}.wonderful-word{color:#793448;font-size:clamp(34px,8vw,70px);font-weight:1000;text-align:center;text-shadow:3px 4px #f6c8a1;animation:wonderful-bloom 1s ease-in-out both}@keyframes wonderful-bloom{0%{opacity:0;transform:scale(.65) rotate(-4deg)}30%{opacity:1;transform:scale(1.12) rotate(2deg)}75%{opacity:1;transform:scale(1)}100%{opacity:1;transform:scale(1)}}@media(max-width:410px){.active-mini-game .top{padding:6px}.active-mini-game .top .brand{font-size:15px}.active-mini-game .nav-actions{gap:5px}.pip-tip .pip{width:52px;height:52px;flex-basis:52px}.pip-bubble{padding:9px 11px}.hero{gap:12px}.hero .pip-bubble{padding:9px}}@media(orientation:landscape) and (max-height:620px){.wonderful-stage{min-height:160px!important}.pip-tip .pip{width:48px;height:48px;flex-basis:48px}.pip-bubble{padding:5px 9px}}</style><script src="assets/animations.js"></script></body></html>
